[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpilot"
version = "0.1.0"
description = "AI-powered business risk intelligence for ForgeHacks 2026"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
